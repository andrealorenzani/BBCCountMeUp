# CountMeUp configuration. See https://www.playframework.com/documentation/3.0.x/Configuration

# Must be set to a long random value in production (e.g. `export APPLICATION_SECRET=...`).
# In dev mode Play generates one when the default is left untouched.
play.http.secret.key = "changeme"
play.http.secret.key = ${?APPLICATION_SECRET}

play.i18n.langs = [ "en" ]

# Database (H2 in file mode, created under ./data on first start)
db.default.driver = org.h2.Driver
db.default.url = "jdbc:h2:file:./data/countmeup"
db.default.url = ${?DB_URL}
db.default.username = "sa"
db.default.password = ""
# Same size as the dedicated database dispatcher below: one thread per connection
play.db.prototype.hikaricp.maximumPoolSize = 10

# The schema is applied automatically (in dev mode no manual click is needed anymore)
play.evolutions.autoApply = true

# Blocking JDBC calls run on their own dispatcher so that they cannot starve the request threads
database.dispatcher {
  executor = "thread-pool-executor"
  throttled-executor = false
  thread-pool-executor {
    fixed-pool-size = 10
  }
}

# Pages only load their own scripts and styles (nothing is inlined or fetched from a CDN),
# so the content security policy can be strict; the websocket is same-origin.
play.filters.enabled += play.filters.csp.CSPFilter
play.filters.csp.directives {
  default-src = "'self'"
  script-src = "'self'"
  style-src = "'self'"
  connect-src = "'self' ws: wss:"
  img-src = "'self' data:"
}
