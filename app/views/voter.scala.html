@()

@main("Vote", "voter", "javascripts/voter.js") {
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h2 class="h4" id="event-title">Loading&hellip;</h2>
            <p class="text-body-secondary" id="event-description"></p>
            <form id="vote-form" class="needs-validation" novalidate hidden>
                <div class="mb-3">
                    <label for="voter" class="form-label">Your voter id</label>
                    <input type="text" class="form-control" id="voter" name="voter" required autocomplete="off">
                </div>
                <fieldset class="mb-3" id="candidates">
                    <legend class="fs-6">Select a candidate</legend>
                </fieldset>
                <button type="submit" class="btn btn-primary">Vote</button>
            </form>
            <div id="feedback" class="mt-3" role="status"></div>
        </div>
    </div>
}
