@(title: String, active: String, script: String)(content: Html)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@title · CountMeUp</title>
    <link rel="stylesheet" href="@routes.Assets.versioned("vendor/bootstrap.min.css")">
    <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/main.css")">
    <link rel="icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">
    <script src="@routes.Assets.versioned("vendor/chart.umd.min.js")" defer></script>
    <script type="module" src="@routes.Assets.versioned(script)"></script>
</head>
<body>
<div class="container py-4">
    <header class="d-flex flex-wrap align-items-center justify-content-between pb-3 mb-4 border-bottom">
        <h1 class="h3 text-body-secondary mb-0">CountMeUp</h1>
        <ul class="nav nav-pills">
            @for((path, label) <- Seq("presenter" -> "Results", "voter" -> "Vote", "admin" -> "Admin")) {
                <li class="nav-item"><a class="nav-link@if(path == active) { active}" href="/@path">@label</a></li>
            }
        </ul>
    </header>

    <main>@content</main>

    <footer class="pt-3 mt-4 border-top text-body-secondary small">
        &copy; Andrea Lorenzani, 2017&ndash;2026
    </footer>
</div>
</body>
</html>
