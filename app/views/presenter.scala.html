@()

@main("Results", "presenter", "javascripts/presenter.js") {
    <div id="event-title" class="mb-3">
        <h2 class="h4 mb-0">Loading&hellip;</h2>
        <p class="text-body-secondary mb-0" id="event-description"></p>
    </div>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="btn-group mb-3" role="group" aria-label="Chart type" id="chart-types">
                <button type="button" class="btn btn-outline-primary active" data-type="doughnut">Doughnut</button>
                <button type="button" class="btn btn-outline-primary" data-type="bar">Column</button>
                <button type="button" class="btn btn-outline-primary" data-type="pie">Pie</button>
            </div>
            <div class="chart-box"><canvas id="chart" aria-label="Votes per candidate" role="img"></canvas></div>
        </div>
        <div class="col-lg-6">
            <table class="table align-middle" id="results-table">
                <thead><tr><th>Candidate</th><th class="text-end">Votes</th><th class="text-end">Share</th></tr></thead>
                <tbody></tbody>
            </table>
            <p class="text-body-secondary small" id="live-status"></p>
        </div>
    </div>
}
