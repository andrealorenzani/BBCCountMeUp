@()

@main("Admin", "admin", "javascripts/admin.js") {
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="h4">Create a new event</h2>
            <p class="text-body-secondary">Opening an event closes the one that is currently open.</p>
            <form id="event-form" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label">Name of the event</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description of the event</label>
                    <input type="text" class="form-control" id="description" required>
                </div>
                <h3 class="h6">Candidates (at least two)</h3>
                <div id="candidates"></div>
                <div class="d-flex gap-2 mt-3">
                    <button type="button" class="btn btn-outline-secondary" id="add-candidate">Add candidate</button>
                    <button type="submit" class="btn btn-primary">Create event</button>
                </div>
            </form>
            <div id="feedback" class="mt-3" role="status"></div>
        </div>
    </div>
}
